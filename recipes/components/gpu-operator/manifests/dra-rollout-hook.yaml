# DRA Kubelet Plugin Re-Roll Hook (issue #980).
#
# Ships as part of the bundler-synthesized "gpu-operator-post" chart.
# Helm post-install,post-upgrade hook that waits for gpu-operator's
# k8s-driver-manager to finish migrating drivers on every managed GPU
# node, then re-rolls the nvidia-dra-driver-gpu kubelet plugin
# DaemonSet. Mirrors the kubectl wait + rollout-restart block in
# pkg/bundler/deployer/helm/templates/deploy.sh.tmpl so the same
# protection applies to every deployer (Helm, helmfile, Flux, Argo CD),
# not just the default Helm deployer that runs ./deploy.sh.
#
# Host-managed-driver overlays (GKE COS, OKE, Kind, Talos) run
# gpu-operator with driver.enabled=false; nvidia-driver-daemonset is
# never created, so the script detects its absence and skips the
# migration wait. If the DRA kubelet plugin DaemonSet is also absent
# (e.g. fresh install before nvidia-dra-driver-gpu's chart has applied)
# the script exits 0 — the rollout-restart is only meaningful when
# both pieces already exist (the upgrade path).

{{- $namespace := .Release.Namespace }}
{{- $draNamespace := "nvidia-dra-driver" }}
{{- $saName := "aicr-dra-rollout-hook" }}
{{- $jobName := "aicr-dra-rollout-hook" }}
{{- $chartLabel := printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: dra-rollout-hook
    helm.sh/chart: {{ $chartLabel }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $saName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: dra-rollout-hook
    helm.sh/chart: {{ $chartLabel }}
rules:
  # Detect host-managed-driver overlays via nvidia-driver-daemonset
  # presence (cross-namespace, since the operator can run in
  # "gpu-operator" or e.g. "privileged-gpu-operator" on Talos).
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  # Wait for per-node gpu-driver-upgrade-state=upgrade-done label.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $saName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: dra-rollout-hook
    helm.sh/chart: {{ $chartLabel }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $saName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ $draNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: dra-rollout-hook
    helm.sh/chart: {{ $chartLabel }}
rules:
  # rollout restart = patch the DaemonSet's pod-template-hash trigger.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "patch"]
  # rollout status reads pods to confirm the new generation is up.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ $draNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: dra-rollout-hook
    helm.sh/chart: {{ $chartLabel }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: dra-rollout-hook
    helm.sh/chart: {{ $chartLabel }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dra-rollout-hook
    spec:
      serviceAccountName: {{ $saName }}
      restartPolicy: OnFailure
      containers:
        - name: rollout
          image: docker.io/bitnami/kubectl:1.34
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              DRA_NS={{ $draNamespace | quote }}

              echo "Locating nvidia-driver-daemonset to determine deployment mode..."
              DRIVER_DS_NS=$(kubectl get daemonset -A \
                -o jsonpath='{.items[?(@.metadata.name=="nvidia-driver-daemonset")].metadata.namespace}' \
                2>/dev/null | awk '{print $1}')

              if [[ -z "${DRIVER_DS_NS}" ]]; then
                echo "  gpu-operator nvidia-driver-daemonset not present (host-managed driver); skipping migration wait"
              else
                MANAGED_NODES=$(kubectl get nodes -l nvidia.com/gpu.deploy.driver=true -o name 2>/dev/null | wc -l | tr -d ' ')
                if [[ "${MANAGED_NODES}" -gt 0 ]]; then
                  echo "  Waiting for gpu-operator driver migration on ${MANAGED_NODES} managed GPU node(s) to reach upgrade-done (ns=${DRIVER_DS_NS})..."
                  if ! kubectl wait --for=jsonpath='{.metadata.labels.nvidia\.com/gpu-driver-upgrade-state}=upgrade-done' \
                       nodes -l nvidia.com/gpu.deploy.driver=true --timeout=15m; then
                    echo "  WARNING: not all managed GPU nodes reached upgrade-done within 15m; proceeding with restart anyway"
                  fi
                else
                  echo "  No nodes labeled nvidia.com/gpu.deploy.driver=true yet; skipping migration wait"
                fi
              fi

              DRA_DS=$(kubectl get daemonset -n "${DRA_NS}" -o name 2>/dev/null | awk '/kubelet-plugin/{print; exit}' || true)
              if [[ -z "${DRA_DS}" ]]; then
                echo "  DRA kubelet plugin daemonset not present in ${DRA_NS}; nothing to restart"
                exit 0
              fi

              echo "  Restarting DRA kubelet plugin (${DRA_DS##*/}) to clear stale NVML state..."
              if ! kubectl rollout restart "${DRA_DS}" -n "${DRA_NS}"; then
                echo "  ERROR: failed to restart DRA kubelet plugin daemonset"
                exit 1
              fi

              echo "  Waiting for DRA kubelet plugin rollout to complete..."
              if ! kubectl rollout status "${DRA_DS}" -n "${DRA_NS}" --timeout=5m; then
                echo "  WARNING: DRA kubelet plugin rollout did not complete within 5m (restart has been triggered)"
              fi

              echo "Done."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
